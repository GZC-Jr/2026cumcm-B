[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mathmodel-viz"
version = "0.1.0"
description = "A structured visualization catalog and utilities for mathematical modeling."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "plotly>=5.18",
    "altair>=5.0",
    "networkx>=3.0",
    "scipy>=1.10",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
geo = [
    "geopandas>=0.14",
    "folium>=0.16",
    "contextily>=1.6",
    "cartopy>=0.22",
]
interactive = [
    "bokeh>=3.4",
    "holoviews>=1.18",
    "hvplot>=0.10",
    "panel>=1.4",
]
three-d = ["pyvista>=0.43"]
dashboard = ["dash>=2.17", "streamlit>=1.37"]
model-diagnostics = [
    "scikit-learn>=1.3",
    "yellowbrick>=1.5",
    "shap>=0.45",
    "salib>=1.5",
    "arviz>=0.18",
]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
mathmodel-viz = "mathmodel_viz.cli:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
